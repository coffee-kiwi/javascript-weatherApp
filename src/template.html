<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the weather app</h1>
    </header>

    <main>
      <section id="sidebar">
        <div class="form">
          <form id="search-form" role="search">
            <label for="search-box">Location:</label>
            <input type="search"
                    id="search-box"
                    placeholder="New York"
            >
            <button id="searchBtn">Search Weather</button>
          </form>
          <button type="button" id="metricBtn">Toggle: Fareinheit</button>
        </div>
      </section>
      
      <section class="display-section">
        <div id="content"></div>

      </section>

    </main>
   
  </body>
</html>
