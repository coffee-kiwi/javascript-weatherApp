<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the wonderful weather app</h1>
    </header>

    <main>
      <section id="sidebar">
        <h1 class="sidebar-title">Seach a location below:</h1>
        <div class="form">
          <form id="search-form" role="search">
            <div>
              <label for="search-box">Location:</label>
              <input type="search"
                      id="search-box"
                      placeholder="New York"
              >
            </div>
            <button id="searchBtn">Search Weather</button>
          </form>
          <button type="button" id="metricBtn">Toggle: Fareinheit/Celsius</button>
        </div>
      </section>
      
      <section class="display-section">
        <div id="alertDiv"></div>
        <div id="content"></div>
        <div id="icons"></div>
      </section>

    </main>
   
  </body>
</html>
